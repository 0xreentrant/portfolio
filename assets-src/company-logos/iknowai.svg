<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#181433"/>

  <g transform="translate(0,5)">
    <!-- Arrow shaft, pointing down at the robot's face -->
    <line x1="32" y1="4" x2="32" y2="13" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>

    <!-- Arrowhead, tip touching the top of the head -->
    <path d="M 32 21 L 25 10 L 32 13.5 L 39 10 Z" fill="#22D3EE"/>

    <!-- Robot head -->
    <rect x="12" y="20" width="40" height="32" rx="9" fill="#F4F2FF" stroke="#3B2E82" stroke-width="2.5"/>

    <!-- Ears / side nubs -->
    <rect x="8" y="30" width="5" height="10" rx="2.5" fill="#3B2E82"/>
    <rect x="51" y="30" width="5" height="10" rx="2.5" fill="#3B2E82"/>

    <!-- Eyes -->
    <rect x="19" y="30" width="8" height="10" rx="3" fill="#4C3AA8"/>
    <rect x="37" y="30" width="8" height="10" rx="3" fill="#4C3AA8"/>
    <rect x="21.5" y="32.5" width="3" height="3" rx="1" fill="#22D3EE"/>
    <rect x="39.5" y="32.5" width="3" height="3" rx="1" fill="#22D3EE"/>

    <!-- Mouth: speaker grid -->
    <rect x="21" y="43" width="22" height="6" rx="2" fill="#3B2E82"/>
    <rect x="24" y="44.5" width="2.5" height="3" fill="#F4F2FF"/>
    <rect x="29" y="44.5" width="2.5" height="3" fill="#F4F2FF"/>
    <rect x="34" y="44.5" width="2.5" height="3" fill="#F4F2FF"/>
    <rect x="39" y="44.5" width="2.5" height="3" fill="#F4F2FF"/>
  </g>
</svg>
